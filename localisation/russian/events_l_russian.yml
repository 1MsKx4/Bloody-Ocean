l_russian:
 soviet.4000000.t: "Зов Анархии"
 soviet.4000000.desc: "— Сашка, Ванька! Слышали, что с Петькой сделалось?\n\n— Хм? С Петькой? Дай-ка вспомню... Это тот дурачок, что с гранатой целовался, уверяя, будто это его покойная жена вернулась? Помню, конечно.\n\n— Зря ты так, Сашка. Петька ведь не виноват, что у него крыша поехала из-за войны... Лучше бы спасибо сказал — если бы не он, так бы и остались под теми обломками!\n\n— Да понятно, что он герой-дурачок, спору нет, я вообще сначала про другое хотел рассказать... В общем, в последнее время он всё время орал про какой-то голос, который его зовёт. Все думали — про жену бредит, а он клянётся, что голос другой, далёкий-далёкий, прямиком из Тайги!\n\n— Тайги?\n\n— Из Тайги, значит... Это очень далеко, туда фронт никогда не дойдёт...\n\n— Правильно, Сашка, никогда...\n\n— Позовите ка Афоньку..."
 soviet.4000000.a: "«Товарищ! У нас 4 дезертира!»"
 kazakhstan.4000000.t: "По ту сторону реки"
 kazakhstan.4000000.desc: "Новый день всегда приносил свежие новости. Михаил, по дороге домой, не изменяя своей привычке, зашёл в местный магазинчик и купил свежую, слегка помятую газету.\n\n «В связи с продолжительной войной и общей дестабилизацией фронта правительство Казахской ССР принимает решение о заключении мира с Германским Рейхом.\n\n По условиям достигнутого соглашения государственная граница переносится на берег реки Урал.\n\n Территории, находящиеся на левом берегу, передаются под контроль Германии для формирования нового государства во главе с “Туркестанским легионом”. Территории же правого берега подвергаются полной демилитаризации.\n\n Данное решение принято с целью прекращения боевых действий и стабилизации обстановки в регионе. Казахская ССР признаёт новую линию границы и подтверждает готовность соблюдать условия мира».\n\n Осознав прочитанное, он поспешно поднялся с кресла и направился в комнату своего единственного сына, уцелевшего в этой войне."
 kazakhstan.4000000.a: "Коля, собирайся, мы едем к бабушке..."
 kazakhstan.100.t: "Подготовка к революции"
 kazakhstan.100.desc: "Поражение Советского Союза оставило тлеющие угли революции в сердцах многих наших товарищей. В глухих аулах, в заброшенных шахтах и на закрытых заводах бывшей КазССР мы восстанавливаем сеть ячеек. Народ, разочарованный нынешним правительством, ищет новую надежду. Эта надежда — мы. Пришло время объединить разрозненные группы под единым знаменем и начать подготовку к освобождению родины трудящихся."
 kazakhstan.100.a: "Готовсь..."
 kazakhstan.200.t: "Выбор целей"
 kazakhstan.200.desc: "Ошибочно предполагать что угнетенный пролетариат будет выплескивать злость революции в случайные и не особо важные для буржуазии объекты. Наоборот, тот пролетариат что действительно готов сражаться ищет и анализирует каждый дом, фабрику, завод, мэрию...Он ищет куда бить врага чтобы тот не мог встать."
 kazakhstan.200.a: "Целься..."
 kazakhstan.300.t: "Пламя Революции"
 kazakhstan.300.desc: "„Всеобщая вера в революцию есть уже начало революции.“ — Владимир Ильич Ленин."
 kazakhstan.300.a: "ОГОНЬ!!!"
 kazakhstan.400.t: "Что же нам делать теперь?"
 kazakhstan.400.desc: "Поражение советского союза очень сильно сказалось на нашем духе, мы больше не могли продолжать хоть какие либо боевые действия из за чего нам пришлось выйти из его состава и забыть все те беды как страшный сон...Независимость которую мы получили слегка подняла дух и настроение народа, но просто получить независимости недостаточно, нужно выбрать путь через который мы проведем нашу родину и нацию."
 kazakhstan.400.a: "Свобода, но какой ценой?"




 news.1.t: "Крах немецкой экономики"
 news.1.d: "Казалось, что ещё совсем недавно победить Рейх мог разве что Господь или настоящее чудо, но, если верить поступающей информации, Рейх способен уничтожить сам себя. \nВоенная экономика, рассчитанная на ведение тотальной войны, теперь не просто бесполезна для такого огромного государства, теперь она становится для него смертельно опасной. \nСотни предприятий, созданных для штамповки техники и оружия, теперь должны обеспечивать население миллионами товаров народного потребления, но к этому они не готовы. \nТочно так же не готова и берлинская верхушка, которая пребывает в состоянии полного ступора и, по сути, не понимает, что делать прямо сейчас. \nВозможно, Рейх больше не будет представлять угрозы для оставшегося свободного мира, однако задувать свечи пока ещё слишком рано."
 news.1.a: "Может быть, они уничтожат сами себя?"
 news.1.b: "На нашу родину наступает тьма..."
 news.1.c: "Какие прекрасные новости"
















 MINIMIZE_EVENT: "§GЩёлкните§!, чтобы свернуть. Событие будет размещено в разделе §H«События и решения»§! области событий."
 country_capitulated.0.t: "[Root.GetName] капитулирует"
 country_capitulated.0.d_positive_both_no_faction: "\n[From.From.GetLeader] заявил, что [From.From.GetAdjective]ий натиск позволил занять всю страну и сломил трусливый [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти сбежали за границу и создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион.\nХотя война и продолжается в других районах, [From.From.GetNameDef] уже может праздновать важную победу."
 country_capitulated.0.d_positive_prev_no_faction: "\n[From.From.GetLeader] заявляет, что [From.From.GetAdjective]ий натиск позволил занять всю страну и сломил трусливый [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти сбежали за границу и создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион.\nХотя война с остатками альянса [Root.GetFactionName] и продолжается в других районах, [From.From.GetNameDef] уже может праздновать важную победу."
 country_capitulated.0.d_positive_prev_faction: "\n[From.From.GetLeader] заявляет, что [From.From.GetAdjective]ий натиск позволил занять всю страну и сломил трусливый [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти сбежали за границу и создали правительство в изгнании. Основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует главный регион.\nХотя война с остатками альянса [Root.GetFactionName] и продолжается в других районах, альянс [From.From.GetFactionName] уже может праздновать важную победу."
 country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader] заявил, что [From.From.GetAdjective]ий агрессор, бесчинствующий в стране, не поставит на колени [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти создали правительство в изгнании. Основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их главный регион страны.\nНесмотря на это сокрушительное поражение, мы продолжим борьбу — [From.From.GetNameDef] еще далека от победы в этой войне."
 country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader] заявил, что [From.From.GetAdjective]ий агрессор, бесчинствующий в стране, не поставит на колени [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион.\nИ пусть государство [From.From.GetNameDef] еще далеко от победы в войне, это поражение стало серьезным ударом для всего альянса [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader] заявил, что [From.From.GetAdjective]ий агрессор, бесчинствующий в стране, не поставит на колени [Root.GetAdjective]ий народ. [Root.GetAdjective]ой власти создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион страны.\nИ пусть [From.From.GetNameDef] и [From.From.GetFactionName] еще далеки от победы в войне, это поражение стало серьезным ударом для всего альянса [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction: "\n[Root.GetAdjective]ие власти создали правительство в изгнании, а капитуляцию основных сил принял представитель государства [From.From.GetNameDef], теперь контролирующий главный регион страны.\n\nНесмотря на то, что [From.From.GetName] и [Root.GetName] завершили свой конфликт, [From.From.GetNameDef] продолжает вести полномасштабную войну в других регионах."
 country_capitulated.0.d_neutral_prev_no_faction: "\n[Root.GetAdjective]ие Власти создали правительство в изгнании, а капитуляцию основных сил принял представитель государства [From.From.GetNameDef], теперь контролирующий главный регион страны.\n\n[Root.GetName] была незначительной частью крупного конфликта. Война, в которую втянуты [From.From.GetNameDef] и остатки альянса [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.d_neutral_prev_faction: "\n[Root.GetAdjective]ие власти создали правительство в изгнании, а капитуляцию основных сил принял представитель государства [From.From.GetNameDef], теперь контролирующий главный регион страны.\n\n[From.From.GetNameDef] и [Root.GetNameDef] являлись незначительными участниками крупного конфликта. Война, в которую втянуты [From.From.GetFactionName] и остатки альянса [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.d_positive_collab_diff_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. [From.From.GetAdjective]ие войска вместе с независимыми [Root.GetAdjective]ими [From.From.GetRulingIdeology_RU_lower_Adherent_Nom]ами добились того, что [Root.GetLeader] вместе с правительством уходят в отставку. Сейчас основано новое правительство, которое будет возглавлять государство [Root.GetNameDef], в чём ему поможет [From.From.GetNameDef]. [From.From.GetLeader] отмечает, что это взаимное соглашение приведёт к началу в государстве [Root.GetNameDef] новой эпохи мира и процветания.\n[Root.GetLeader] в ответ заметил, что даже в ссылке он продолжит сражаться за державу [Root.GetNameDef] и будет поддерживать сопротивление у себя на родине."
 country_capitulated.0.d_positive_collab_invaded_same_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. Несколько [Root.GetAdjective]их граждан, недовольных разновидностью [From.From.GetRulingIdeologyNoun_RU_lower_Gen], которую принёс в государство [Root.GetNameDef] [Root.GetLeader], присоединились к [From.From.GetAdjective]им солдатам, чтобы лишить его власти и учредить новое правительство, которое возглавит [From.From.GetNameDef]. [From.From.GetLeader] отмечает, что это взаимное соглашение приведёт к началу эпохи мира и процветания в государстве [From.From.GetNameDef].\n[Root.GetLeader] в ответ заметил, что [From.From.GetLeader] не есть истинный [From.From.GetRulingIdeology_RU_lower_Adherent_Nom], что даже в ссылке он продолжит сражаться за державу [Root.GetNameDef] и будет поддерживать сопротивление у себя на родине."
 country_capitulated.0.d_negative_collab_diff_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. Очевидно, что снисходительность [Root.GetAdjective]ого правительства к доморощенным [From.From.GetRulingIdeology_RU_lower_Adherent_Nom]ам сыграла свою роль в падении государства [Root.GetName]. [Root.GetFascistLeader] теперь занимает ведущую роль и будет править страной во имя режима, который установил [From.From.GetLeader].\n[Root.GetLeader] утверждает, что это не конец [Root.GetAdjective]ого суверенитета и что правительство, находясь в ссылке, будет поддерживать сопротивление в стране."
 country_capitulated.0.a: "Отличная новость!"
 country_capitulated.0.b: "Это тяжелые времена"
 country_capitulated.0.c: "Это неспокойное время"
 CAN_ANGERED_WORKERS: "Это встревожит граждан."
